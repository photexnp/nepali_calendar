<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Nepali Calendar">
  <title>Nepali Calendar</title>
  <!-- Background: crimson with a blue frame, after the Nepali flag -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#003893"/>
  <rect x="12" y="12" width="232" height="232" rx="46" fill="#DC143C"/>
  <!-- Calendar page -->
  <rect x="52" y="66" width="152" height="140" rx="16" fill="#FFFFFF"/>
  <path d="M52 82a16 16 0 0 1 16-16h120a16 16 0 0 1 16 16v22H52z" fill="#003893"/>
  <!-- Binding rings -->
  <rect x="84" y="50" width="14" height="34" rx="7" fill="#FFFFFF"/>
  <rect x="158" y="50" width="14" height="34" rx="7" fill="#FFFFFF"/>
  <!-- Day grid -->
  <g fill="#DC143C">
    <rect x="72" y="120" width="20" height="16" rx="4"/>
    <rect x="102" y="120" width="20" height="16" rx="4"/>
    <rect x="132" y="120" width="20" height="16" rx="4"/>
    <rect x="162" y="120" width="20" height="16" rx="4"/>
    <rect x="72" y="146" width="20" height="16" rx="4"/>
    <rect x="102" y="146" width="20" height="16" rx="4"/>
    <rect x="162" y="146" width="20" height="16" rx="4"/>
    <rect x="72" y="172" width="20" height="16" rx="4"/>
    <rect x="102" y="172" width="20" height="16" rx="4"/>
    <rect x="132" y="172" width="20" height="16" rx="4"/>
  </g>
  <!-- Highlighted day -->
  <rect x="130" y="144" width="24" height="20" rx="5" fill="#003893"/>
</svg>
